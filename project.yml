name: HotSlot
options:
  bundleIdPrefix: com.hotslot
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: 2.14.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "35"
    DEVELOPMENT_TEAM: 53M8KYX8G4
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

targets:
  HotSlot:
    type: application
    platform: macOS
    sources:
      - path: HotSlot
      # Modelos, persistencia y tema que comparten el Mac y el iPhone.
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hotslot.app
        PRODUCT_NAME: Slots
        PRODUCT_MODULE_NAME: HotSlot
        INFOPLIST_FILE: HotSlot/Resources/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        # Sin sandbox: el sandbox bloquea el aviso TCC de Accesibilidad (universalAccessAuthWarn) y el pegado con CGEvent.
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    entitlements:
      path: HotSlot/Resources/Slots.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.hotslot.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.aps-environment: development
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
        product: Sparkle
      - package: TelemetryDeck
        product: TelemetryDeck
    preBuildScripts:
      - name: Strip Quarantine (Resources)
        basedOnDependencyAnalysis: false
        script: |
          xattr -cr "${SRCROOT}/HotSlot/Resources" 2>/dev/null || true
    postBuildScripts:
      - name: Strip Quarantine (App Bundle)
        basedOnDependencyAnalysis: false
        script: |
          xattr -cr "${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}" 2>/dev/null || true

  HotSlotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HotSlotTests
    dependencies:
      - target: HotSlot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hotslot.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Slots.app/Contents/MacOS/Slots"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # App de iPhone. Comparte `Shared/` y las fuentes con el Mac.
  SlotsIOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SlotsIOS
      - path: SlotsIOSShared
      - path: Shared
      - path: HotSlot/Resources/Fonts
        buildPhase: resources
    dependencies:
      - target: SlotsWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hotslot.app
        PRODUCT_NAME: Slots
        PRODUCT_MODULE_NAME: SlotsIOS
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: SlotsIOS/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: es
        CFBundleDisplayName: Slots
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchStoryboardName: LaunchScreen
        # El modo oscuro no está diseñado: se fuerza el claro.
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - InterTight-Regular.ttf
          - InterTight-Medium.ttf
          - InterTight-SemiBold.ttf
        # Avisos silenciosos de CloudKit para sincronizar en segundo plano.
        UIBackgroundModes:
          - remote-notification
        # Tipos de arrastre internos (slot y biblioteca): iOS pide declararlos.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hotslot.app.slot-drag
            UTTypeDescription: Slot de Slots
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.hotslot.app.library-drag
            UTTypeDescription: Biblioteca de Slots
            UTTypeConformsTo:
              - public.data
        # Los widgets abren la app en una biblioteca: hotslot://library/<id>.
        CFBundleURLTypes:
          - CFBundleURLName: com.hotslot.app
            CFBundleURLSchemes:
              - hotslot
    entitlements:
      path: SlotsIOS/Resources/Slots.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.hotslot.app
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
        # Datos compartidos con los widgets y los atajos.
        com.apple.security.application-groups:
          - group.com.hotslot.app

  # Widgets, controles y atajos de iPhone. Leen la base del App Group sin iCloud.
  SlotsWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SlotsWidgets
      - path: SlotsIOSShared
      - path: Shared
      - path: HotSlot/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hotslot.app.widgets
        PRODUCT_NAME: SlotsWidgets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: SlotsWidgets/Info.plist
      properties:
        CFBundleDisplayName: Slots
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIAppFonts:
          - InterTight-Regular.ttf
          - InterTight-Medium.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SlotsWidgets/SlotsWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hotslot.app

schemes:
  SlotsIOS:
    build:
      targets:
        SlotsIOS: all
  HotSlot:
    build:
      targets:
        HotSlot: all
        HotSlotTests: [test]
    test:
      targets:
        - HotSlotTests
