name: HotSlot
options:
  bundleIdPrefix: com.hotslot
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.18.0"
    CURRENT_PROJECT_VERSION: "21"
    DEVELOPMENT_TEAM: 53M8KYX8G4
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

targets:
  HotSlot:
    type: application
    platform: macOS
    sources:
      - path: HotSlot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hotslot.app
        PRODUCT_NAME: Slots
        PRODUCT_MODULE_NAME: HotSlot
        INFOPLIST_FILE: HotSlot/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HotSlot/Resources/HotSlot.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
        product: Sparkle
    preBuildScripts:
      - name: Strip Quarantine (Resources)
        basedOnDependencyAnalysis: false
        script: |
          xattr -cr "${SRCROOT}/HotSlot/Resources" 2>/dev/null || true
    postBuildScripts:
      - name: Strip Quarantine (App Bundle)
        basedOnDependencyAnalysis: false
        script: |
          xattr -cr "${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}" 2>/dev/null || true
    entitlements:
      path: HotSlot/Resources/HotSlot.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.automation.apple-events: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - "/Library/Application Support/HotSlot/"

  HotSlotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HotSlotTests
    dependencies:
      - target: HotSlot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hotslot.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Slots.app/Contents/MacOS/Slots"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  HotSlot:
    build:
      targets:
        HotSlot: all
        HotSlotTests: [test]
    test:
      targets:
        - HotSlotTests
