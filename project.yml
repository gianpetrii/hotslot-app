name: HotSlot
options:
  bundleIdPrefix: com.hotslot
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.20.1"
    CURRENT_PROJECT_VERSION: "28"
    DEVELOPMENT_TEAM: 53M8KYX8G4
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

targets:
  HotSlot:
    type: application
    platform: macOS
    sources:
      - path: HotSlot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hotslot.app
        PRODUCT_NAME: Slots
        PRODUCT_MODULE_NAME: HotSlot
        INFOPLIST_FILE: HotSlot/Resources/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        # Sin sandbox: el sandbox bloquea el aviso TCC de Accesibilidad (universalAccessAuthWarn) y el pegado con CGEvent.
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
        product: Sparkle
    preBuildScripts:
      - name: Strip Quarantine (Resources)
        basedOnDependencyAnalysis: false
        script: |
          xattr -cr "${SRCROOT}/HotSlot/Resources" 2>/dev/null || true
    postBuildScripts:
      - name: Strip Quarantine (App Bundle)
        basedOnDependencyAnalysis: false
        script: |
          xattr -cr "${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}" 2>/dev/null || true

  HotSlotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HotSlotTests
    dependencies:
      - target: HotSlot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hotslot.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Slots.app/Contents/MacOS/Slots"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  HotSlot:
    build:
      targets:
        HotSlot: all
        HotSlotTests: [test]
    test:
      targets:
        - HotSlotTests
